# Apache sert le dossier public/ et rien d'autre.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Require all granted
        AllowOverride None

        # Point d'entrée unique : toute adresse qui ne correspond pas à un
        # fichier existant (image, CSS, JavaScript) est confiée à index.php.
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
