; Réglages PHP du projet, chargés par le conteneur « app ».
; Après une modification : docker compose restart app
;
; Ce sont ici les valeurs par défaut de PHP. Si vous importez les gros fichiers
; annuels, c'est à vous de les surveiller et de les régler, voir la partie
; « En PHP sans framework » du sujet.

; Mémoire maximale d'un script
memory_limit = 128M

; Durée maximale d'un script servi par le web, en secondes.
; En ligne de commande, PHP n'applique aucune limite de durée.
max_execution_time = 30

date.timezone = Europe/Paris
